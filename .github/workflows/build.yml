      # the best part of an hour, and everything the bundle has to reproduce is
      # decided by gn — so the command call.cc is compiled with gets read out
      # here, where it is readable whether or not the build that follows works.
      #
      # Still cmd, and the args string is still spelled with backslash-escaped
      # quotes: this exact line is what built win-x64 in xVeil's run
      # 30665287484, and re-quoting it for a nicer shell is a way to lose an
      # hour to gn parsing `target_os=win` as a bare identifier.
      - name: Configure
        shell: cmd
        run: |
          cd /d %WEBRTC_ROOT%\src
          call gn gen out/win-x64 --export-compile-commands --args="target_os=\"win\" target_cpu=\"x64\" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false" || exit /b 1
          if not exist out\win-x64\compile_commands.json (
            echo ::error::gn produced no compile_commands.json - the bundle is built out of it
            exit /b 1
          )

      # What the bundle has to be able to reproduce, printed once. Windows is
      # the one target whose compile command has never been read: it decides
      # whether the sysroot is inside the checkout, whether the source path in
      # the command is the same string as the entry's "file" field, and which
      # CRT the wrapper has to link — none of which is guessable from the other
      # four targets.
      - name: Record the command the bundle has to reproduce
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # python, not ConvertFrom-Json: compile_commands.json is ~100 MB here
          # and PowerShell's JSON parser turns that into minutes and gigabytes.
          $py = @(
            'import json, sys',
            'cc = json.load(open(sys.argv[1]))',
            'e = next(x for x in cc if x.get("file", "").replace("\\", "/").endswith("call/call.cc"))',
            'print("entries:  ", len(cc))',
            'print("directory:", e["directory"])',
            'print("file:     ", e["file"])',
            'print("command:  ", e.get("command") or " ".join(e["arguments"]))'
          ) -join "`n"
          Set-Content -Path "$env:RUNNER_TEMP\show_cc.py" -Value $py -Encoding ascii
          & C:\depot_tools\python3.bat "$env:RUNNER_TEMP\show_cc.py" `
            "$env:WEBRTC_ROOT\src\out\win-x64\compile_commands.json"
          if ($LASTEXITCODE -ne 0) { throw 'call/call.cc is not in compile_commands.json' }

      - name: Build webrtc.lib
        shell: cmd
        run: |
          cd /d %WEBRTC_ROOT%\src
          rem Named for the same reason as in win-arm64 below: nothing in the
          rem `webrtc` graph requires libc++, so its presence here is a side
          rem effect this build should not depend on. Already built on x64, so
          rem naming it costs nothing and turns a silent gap into a hard stop.
          call ninja -C out/win-x64 webrtc buildtools/third_party/libc++ || exit /b 1
