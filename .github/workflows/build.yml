          if (-not $vs) { throw "vswhere found no Visual Studio installation" }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify --installPath $vs --quiet --norestart --nocache `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --add Microsoft.VisualStudio.Component.VC.ATL.ARM64 | Out-Null
          # Assert rather than trust: the installer exits 0 on plenty of
          # no-ops, and a missing toolchain must fail HERE.
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $cl = Join-Path $tools.FullName 'bin\Hostx64\arm64\cl.exe'
