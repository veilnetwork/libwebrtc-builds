      # Assert rather than trust: an empty objects directory is exactly what
      # shipped last time, and it stays invisible until the wrapper link.
      - name: Assert the C++ runtime objects exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:WEBRTC_ROOT\src\out\win-arm64\obj\buildtools\third_party\libc++"
          $n = (Get-ChildItem -Path $dir -Filter *.obj -Recurse -ErrorAction SilentlyContinue |
                Measure-Object).Count
          if ($n -eq 0) { throw "no libc++ objects under $dir - the wrapper cannot link" }
          Write-Host "  libc++: $n objects"

      - name: Package the SDK bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # depot_tools' own cpython, which the step above proved is installed.
          # `python3` is not a name that resolves on a Windows runner's PATH,
          # and `python` is whatever the image happens to preinstall.
          & C:\depot_tools\python3.bat scripts\pack_sdk.py `
            --src "$env:WEBRTC_ROOT\src" `
            --out "out/win-arm64" `
            --target win-arm64 `
            --dest "$env:SDK_STAGE\veil-webrtc-sdk-win-arm64" `
            --webrtc-pin "$env:WEBRTC_PIN" `
            --depot-tools-pin "$env:DEPOT_TOOLS_PIN" `
            --schema "$env:SDK_SCHEMA" `
            --built-by "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'pack_sdk.py failed' }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

      # Zip rather than tar.xz on this one target: PowerShell's Expand-Archive
      # reads it with no question, and whether the bundled tar.exe was built
      # with liblzma is not something to discover on a consumer's machine.
      #
      # Compressed with 7-Zip when the image has it, because Compress-Archive
      # walks a multi-gigabyte tree one entry at a time and this bundle carries
      # a clang toolchain. Compress-Archive stays as the fallback so the step
      # does not depend on an image detail.
      - name: Compress
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:SDK_ASSETS | Out-Null
          $bundle = "$env:SDK_STAGE\veil-webrtc-sdk-win-arm64"
          $zip = "$env:SDK_ASSETS\veil-webrtc-sdk-win-arm64.zip"
          $sevenZip = @("$env:ProgramFiles\7-Zip\7z.exe", "${env:ProgramFiles(x86)}\7-Zip\7z.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($sevenZip) {
            Write-Host "==> compressing with $sevenZip"
            & $sevenZip a -tzip -mx=6 -mmt=on -bso0 -bsp0 $zip $bundle
            if ($LASTEXITCODE -ne 0) { throw "7z exited $LASTEXITCODE" }
          } else {
            Write-Host '==> compressing with Compress-Archive'
            Compress-Archive -Path $bundle -DestinationPath $zip
          }
          if (-not (Test-Path $zip)) { throw "no $zip after compressing" }

          Copy-Item "$bundle\src\out\win-arm64\obj\webrtc.lib" "$env:SDK_ASSETS\webrtc-win-arm64.lib"
          Copy-Item "$bundle\veil-webrtc-sdk.json" "$env:SDK_ASSETS\veil-webrtc-sdk-win-arm64.json"
          Get-ChildItem $env:SDK_ASSETS | Select-Object Name, Length | Format-Table
          # A release asset is capped at 2 GB and this is the only target whose
          # archive could approach it. Fail here, where it is one line, rather
          # than in the publish job after another hour.
          $size = (Get-Item $zip).Length
          if ($size -ge 2GB) { throw "$zip is $size bytes - over GitHub's 2 GB asset cap" }

      # Uploaded BEFORE the verify below, which is the one departure from the
      # linux job's order. The verify runs a wrapper build that this repository
      # does not own; if it fails, the hour of WebRTC that produced these assets
      # should still be in hand to look at rather than thrown away with the
      # runner.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Forward slashes: this is a glob pattern, not a path, and a
          # backslash in one is an escape character.
          name: sdk-win-arm64
          path: C:/sdk-assets/*
          if-no-files-found: error

      # The claim being tested is "this bundle alone builds the wrapper", so the
      # checkout it was cut from is renamed away first — see verify-sdk.ps1 and
      # the identical note on the linux job.
      - name: The bundle alone builds the wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/veilnetwork/veil.git "$env:RUNNER_TEMP\veil"
          if ($LASTEXITCODE -ne 0) { throw 'could not clone veil' }
          Write-Host "veil at $(git -C "$env:RUNNER_TEMP\veil" rev-parse HEAD)"
          & .\scripts\verify-sdk.ps1 `
            -Bundle "$env:SDK_STAGE\veil-webrtc-sdk-win-arm64" `
            -Target win-arm64 `
            -Veil "$env:RUNNER_TEMP\veil" `
            -Hide "$env:WEBRTC_ROOT" `
            -Dest "$env:RUNNER_TEMP\engine-out"

  # -------------------------------------------------------------- publish ---
  # The only job that can write. It compiles nothing and downloads nothing from
  # the network beyond the run's own artifacts, so the token with write access
  # is never in the same job as a build that executes third-party code.
  publish:
    name: publish
    # windows-arm64 joins the wait. `always()` below already lets publish run
    # when a target was not requested — a job skipped by its `if` is not a
    # failure — so adding it here does not tie an x64-only run to an arm64
    # build that never started.
    needs: [linux, apple, windows, windows-arm64]
    if: ${{ !cancelled() && inputs.publish
        && (needs.linux.result == 'success' || needs.apple.result == 'success'
            || needs.windows.result == 'success'
            || needs['windows-arm64'].result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the pins
        run: grep -E '^[A-Z_]+=' PIN >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          pattern: sdk-*
          merge-multiple: true

      - name: What is about to be published
        run: |
          set -euo pipefail
          ls -la assets/
          # A publish step that finds nothing to publish must fail, not succeed
          # quietly with an empty release.
          [ -n "$(ls -A assets/)" ] || { echo "::error::no assets were produced"; exit 1; }
          for m in assets/*.json; do echo "--- $m"; cat "$m"; done

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: webrtc-${{ env.WEBRTC_PIN }}
          name: WebRTC ${{ env.WEBRTC_PIN }}
          body: |
            Prebuilt WebRTC for the `veil_media` call engine, at WebRTC commit
            `${{ env.WEBRTC_PIN }}` (depot_tools `${{ env.DEPOT_TOOLS_PIN }}`).

            `veil-webrtc-sdk-<target>.tar.xz` is the bundle to use: extract it,
            run `./setup.sh`, then point the wrapper build at it. Each bundle was
            verified in this run by building the wrapper against it **with the
            WebRTC checkout renamed away**, so it is self-contained by test and
            not by inspection.

            `libwebrtc-<target>.a` is the static library alone. It is published
            because it is what this repository is named after, but on its own it
            is not enough to build the wrapper — see the README.

            Windows spells both of those differently, because the platform does:
            the bundle is `veil-webrtc-sdk-win-x64.zip` and is laid out by
            `setup.ps1`, and the library is `webrtc-win-x64.lib`.

            `veil-webrtc-sdk-<target>.json` is the manifest, published separately
            so a pin check does not have to download the bundle.

            Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: assets/*
          fail_on_unmatched_files: true
