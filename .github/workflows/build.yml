          # `python3` is not a name that resolves on a Windows runner's PATH,
          # and `python` is whatever the image happens to preinstall.
          & C:\depot_tools\python3.bat scripts\pack_sdk.py `
            --src "$env:WEBRTC_ROOT\src" `
            --out "out/win-x64" `
            --target win-x64 `
            --dest "$env:SDK_STAGE\veil-webrtc-sdk-win-x64" `
            --webrtc-pin "$env:WEBRTC_PIN" `
            --depot-tools-pin "$env:DEPOT_TOOLS_PIN" `
            --schema "$env:SDK_SCHEMA" `
            --built-by "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'pack_sdk.py failed' }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

