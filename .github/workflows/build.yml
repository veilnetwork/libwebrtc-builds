          # python, not ConvertFrom-Json: compile_commands.json is ~100 MB here
          # and PowerShell's JSON parser turns that into minutes and gigabytes.
          $py = @(
            'import json, sys',
            'cc = json.load(open(sys.argv[1]))',
            'e = next(x for x in cc if x.get("file", "").replace("\\", "/").endswith("call/call.cc"))',
            'print("entries:  ", len(cc))',
            'print("directory:", e["directory"])',
            'print("file:     ", e["file"])',
            'print("command:  ", e.get("command") or " ".join(e["arguments"]))'
          ) -join "`n"
          Set-Content -Path "$env:RUNNER_TEMP\show_cc.py" -Value $py -Encoding ascii
          & C:\depot_tools\python3.bat "$env:RUNNER_TEMP\show_cc.py" `
            "$env:WEBRTC_ROOT\src\out\win-arm64\compile_commands.json"
          if ($LASTEXITCODE -ne 0) { throw 'call/call.cc is not in compile_commands.json' }

      - name: Build webrtc.lib
        shell: cmd
        run: |
          cd /d %WEBRTC_ROOT%\src
          rem libc++ is asked for BY NAME. `webrtc` is a static library and links
          rem no C++ runtime, so nothing in its graph pulls Chromium's libc++ in
          rem — on x64 it lands there anyway, on arm64 it did not. gn had made
          rem the target (its objects directory exists) and ninja simply never
          rem built it, so the bundle shipped `libc++: 0 files` and the failure
          rem surfaced two steps later, in the wrapper link against the __Cr
          rem inline namespace.
