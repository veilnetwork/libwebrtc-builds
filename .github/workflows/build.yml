      # base install. Without them `gn gen target_cpu="arm64"` succeeds and
      # ninja dies much later on a missing cl.exe for the target — a failure
      # that reads like a build error rather than a missing package. Installed
      # here so the job says so up front; a no-op on an image that has them.
      - name: ARM64 cross tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
