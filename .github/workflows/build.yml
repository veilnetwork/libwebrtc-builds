      # reads it with no question, and whether the bundled tar.exe was built
      # with liblzma is not something to discover on a consumer's machine.
      #
      # Compressed with 7-Zip when the image has it, because Compress-Archive
      # walks a multi-gigabyte tree one entry at a time and this bundle carries
      # a clang toolchain. Compress-Archive stays as the fallback so the step
      # does not depend on an image detail.
      - name: Compress
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:SDK_ASSETS | Out-Null
          $bundle = "$env:SDK_STAGE\veil-webrtc-sdk-win-x64"
          $zip = "$env:SDK_ASSETS\veil-webrtc-sdk-win-x64.zip"
          $sevenZip = @("$env:ProgramFiles\7-Zip\7z.exe", "${env:ProgramFiles(x86)}\7-Zip\7z.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
