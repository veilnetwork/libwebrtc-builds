name: build

# Build WebRTC once, here, so that nobody building the veil_media wrapper has
# to build it again.
#
# The expensive half of a veil_media build is not the wrapper. Measured on the
# xVeil webrtc-linux workflow, run 31609030118:
#
#     gclient sync (the checkout)   24m30s      linux-x64
#     ninja -C out/linux-x64 webrtc 13m26s
#     build_veil_media_so_linux.sh     18s   <- the wrapper. eighteen seconds.
#
# and roughly 33 GB on disk for the checkout. This workflow pays that once per
# WebRTC pin and publishes the result, so the wrapper build becomes a download
# and a ten-second compile on any machine.
#
# It is a BUILD repository, not a fork of WebRTC. WebRTC cannot usefully be
# forked: `fetch webrtc` resolves a dependency tree of ~63 git repositories and
# ~53 cipd packages from Google's own infrastructure, and the read-only GitHub
# mirror (webrtc-mirror/webrtc) does not even contain the commit this project
# pins. See the README.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space-separated. linux-x64 linux-arm64 | android-arm64 android-arm android-x64 | win-x64 win-arm64 | mac-arm64 mac-x64 | ios-arm64 ios-sim-arm64 ios-sim-x64'
        required: false
        type: string
        default: 'linux-x64 android-arm64'
      publish:
        description: 'Attach the results to the release for this pin'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- linux ---
  # One job shape, two targets. Both need an x86_64 Linux HOST: WebRTC's gn
  # asserts host_os=="linux" for Android targets and the NDK it downloads is
  # linux-x86_64 only, so neither a Mac nor an arm64 Linux box can produce the
  # android bundle. The linux-x64 target has the same host requirement for its
  # own toolchain.
  linux:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    if: ${{ contains(inputs.targets, 'linux-') || contains(inputs.targets, 'android-') }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            gn_args: 'target_os="linux" target_cpu="x64" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false'
            gclient_os: ''
            gclient_cpu: ''
          # Cross-compiled on the x64 host, exactly as android-arm64 already is.
          # What a Linux cross-build needs ON TOP is the arm64 SYSROOT: the
          # compiler comes with the checkout, the headers and libraries to link
          # against do not, and the hooks install only the host's unless
          # `target_cpu` says otherwise. Declared in .gclient BEFORE the sync for
          # the same reason `target_os` is — after it, the hook has already run
          # and the build fails deep in the link with no obvious cause.
          - target: linux-arm64
            gn_args: 'target_os="linux" target_cpu="arm64" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false'
            gclient_os: ''
            gclient_cpu: 'arm64'
          - target: android-arm64
            # android_static_analysis="off" is what makes this build FINISH, not
            # an optimisation. WebRTC's default hands the Java lint/ErrorProne
            # checks to a daemon that only exists under depot_tools' autoninja,
            # so under plain ninja every *__validate_deps action dies on
            # "AUTONINJA_BUILD_ID is not set" after fifteen minutes of real
            # compiling. Those targets analyse WebRTC's Java SDK; this build
            # wants libwebrtc.a and neither compiles nor ships that Java.
            gn_args: 'target_os="android" target_cpu="arm64" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false android_static_analysis="off"'
            gclient_os: 'android'
            gclient_cpu: ''
          # The other two ABIs an APK ships. `armeabi-v7a` is still the only
          # thing that runs on the cheap phones this project is for, and
          # `x86_64` is what every emulator is — a developer without it cannot
          # run the app at all on a desktop. Same host, same recipe as arm64;
          # only target_cpu differs, and gn's own name for 32-bit ARM is "arm".
          - target: android-arm
            gn_args: 'target_os="android" target_cpu="arm" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false android_static_analysis="off"'
            gclient_os: 'android'
            gclient_cpu: ''
          - target: android-x64
            gn_args: 'target_os="android" target_cpu="x64" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false android_static_analysis="off"'
            gclient_os: 'android'
            gclient_cpu: ''
    env:
      WEBRTC_ROOT: /home/runner/webrtc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # One source of truth for both pins, read the same way by every job.
      - name: Read the pins
        run: grep -E '^[A-Z_]+=' PIN >> "$GITHUB_ENV"

      - name: Skip targets not asked for
        id: want
        run: |
          if echo "${{ inputs.targets }}" | grep -qw "${{ matrix.target }}"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.target }} was not requested"
          fi

      # The WebRTC checkout plus its build tree does not fit beside the runner's
      # preinstalled toolchains, and the failure arrives as a confusing write
      # error deep inside gclient rather than as "no space".
      - name: Reclaim disk
        if: steps.want.outputs.run == 'yes'
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1

      # PINNED. depot_tools ships auto-updating build tooling that runs with
      # full permissions in this job; off HEAD, every run executes whatever was
      # pushed to main that day and a compromise upstream lands straight in the
      # assets published here.
      - name: depot_tools
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          git clone --filter=blob:none \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          git -C "$HOME/depot_tools" checkout --detach "$DEPOT_TOOLS_PIN"
          # Bootstrap the pinned checkout's own vpython3 + cipd binaries.
          # `gclient` brings them up on first use; `gn` does not, and its
          # wrapper then dies with "python3_bin_reldir.txt not found" — after
          # twenty-five minutes of syncing. It has to run BEFORE the line below,
          # because GITHUB_ENV applies to later steps, so DEPOT_TOOLS_UPDATE is
          # still unset here and the bootstrap may fetch what the pin asks for.
          "$HOME/depot_tools/ensure_bootstrap"
          echo "DEPOT_TOOLS_UPDATE=0" >> "$GITHUB_ENV"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # target_os has to be in .gclient BEFORE the sync, or the NDK and the
      # android sysroot are never fetched and gn fails later on a missing
      # toolchain rather than on the thing that is actually wrong.
      - name: WebRTC at the pinned commit
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          mkdir -p "$WEBRTC_ROOT"
          cd "$WEBRTC_ROOT"
          fetch --nohooks webrtc
          if [ -n "${{ matrix.gclient_os }}" ]; then
            grep -q "target_os" .gclient || echo "target_os = ['${{ matrix.gclient_os }}']" >> .gclient
          fi
          if [ -n "${{ matrix.gclient_cpu }}" ]; then
            grep -q "target_cpu" .gclient || echo "target_cpu = ['${{ matrix.gclient_cpu }}']" >> .gclient
          fi
          cat .gclient
          cd src
          git checkout "$WEBRTC_PIN"
          # Transient 429s from the Google mirrors are normal under load.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "sync attempt $attempt"
            if gclient sync --with_branch_heads --reset --jobs 4; then ok=1; break; fi
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "::error::gclient sync failed after 6 attempts"; exit 1; }

      # --export-compile-commands is not decoration and is the reason this
      # repository can exist: the wrapper build reads call.cc's exact command
      # out of compile_commands.json and swaps only the source file, so the
      # bundle carries that command rather than reinventing two dozen flags.
      - name: Build libwebrtc.a
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          cd "$WEBRTC_ROOT/src"
          gn gen "out/${{ matrix.target }}" --export-compile-commands --args='${{ matrix.gn_args }}'
          test -f "out/${{ matrix.target }}/compile_commands.json" \
            || { echo "::error::gn produced no compile_commands.json — the bundle is built out of it"; exit 1; }
          # The libc++ targets are asked for BY NAME. `webrtc` is a static
          # library and does not link a C++ runtime, so nothing in its graph
          # pulls Chromium's libc++ in — it just happens to be built as a side
          # effect on x64. On arm64 it was not, and the bundle went out with
          # `obj/buildtools/third_party/libc++: 0 files`; the wrapper links
          # against those objects (the __Cr inline namespace), so the failure
          # landed in the self-check with a `find` that matched nothing.
          ninja -C "out/${{ matrix.target }}" webrtc \
            buildtools/third_party/libc++ buildtools/third_party/libc++abi
          ls -la "out/${{ matrix.target }}/obj/libwebrtc.a"
          # Assert rather than trust: an empty objects directory is exactly what
          # shipped last time, and it is invisible until the wrapper link.
          for comp in libc++ libc++abi; do
            n=$(find "out/${{ matrix.target }}/obj/buildtools/third_party/$comp" \
                  -name '*.o' 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] || { echo "::error::no $comp objects — the wrapper cannot link"; exit 1; }
            echo "  $comp: $n objects"
          done

      - name: Package the SDK bundle
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          python3 scripts/pack_sdk.py \
            --src "$WEBRTC_ROOT/src" \
            --out "out/${{ matrix.target }}" \
            --target "${{ matrix.target }}" \
            --dest "$RUNNER_TEMP/veil-webrtc-sdk-${{ matrix.target }}" \
            --webrtc-pin "$WEBRTC_PIN" \
            --depot-tools-pin "$DEPOT_TOOLS_PIN" \
            --schema "$SDK_SCHEMA" \
            --built-by "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # The claim being tested is "this bundle alone builds the wrapper", so the
      # checkout it was cut from is renamed away first. Verified beside that
      # checkout the test would pass for a reason nobody else's machine has:
      # every include path in the command is relative, so a header the bundle
      # forgot resolves against the original tree.
      - name: The bundle alone builds the wrapper
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          # patchelf writes DT_NEEDED libveilclient_ffi.so. The wrapper script
          # only WARNS when it is missing and then produces a .so that fails at
          # load instead of here.
          sudo apt-get update && sudo apt-get install -y patchelf
          git clone --depth 1 https://github.com/veilnetwork/veil.git "$RUNNER_TEMP/veil"
          echo "veil at $(git -C "$RUNNER_TEMP/veil" rev-parse HEAD)"
          bash scripts/verify-sdk.sh \
            --bundle "$RUNNER_TEMP/veil-webrtc-sdk-${{ matrix.target }}" \
            --target "${{ matrix.target }}" \
            --veil "$RUNNER_TEMP/veil" \
            --hide "$WEBRTC_ROOT" \
            --dest "$RUNNER_TEMP/engine-out"

      - name: Compress
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP"
          tar -C "$RUNNER_TEMP" -cf - "veil-webrtc-sdk-${{ matrix.target }}" \
            | xz -T0 -6 > "assets/veil-webrtc-sdk-${{ matrix.target }}.tar.xz"
          # The raw archive on its own, for inspection and for anyone who wants
          # only the library. It is NOT enough to build the wrapper — see the
          # README — but publishing it is cheap and it is what the repository
          # is named after.
          cp "veil-webrtc-sdk-${{ matrix.target }}/src/out/${{ matrix.target }}/obj/libwebrtc.a" \
             "assets/libwebrtc-${{ matrix.target }}.a"
          # The manifest as its own small asset: a consumer checking that its
          # pin matches the published one should not have to download 150 MB
          # to read one field.
          cp "veil-webrtc-sdk-${{ matrix.target }}/veil-webrtc-sdk.json" \
             "assets/veil-webrtc-sdk-${{ matrix.target }}.json"
          ls -la assets/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.want.outputs.run == 'yes'
        with:
          name: sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error

  # ---------------------------------------------------------------- apple ---
  # macOS and iOS need a macOS HOST: the toolchain is Xcode's, the frameworks
  # (AVFoundation, VideoToolbox, CoreMedia) come from Apple's SDK, and neither
  # is fetched by depot_tools the way the Android NDK is.
  #
  # The packaging already knew about these targets before this job existed:
  # pack_sdk.py rewrites `-isysroot` to whatever Xcode the CONSUMER has, because
  # Apple's SDK is not ours to redistribute and the consumer's version differs,
  # and it recreates the `sdk/xcode_links` symlink the link step reads instead of
  # compile_commands.json. verify-sdk.sh has had a recipe for `mac-*` and
  # `ios-*` for as long. So this job is the missing half, not a new mechanism.
  apple:
    name: ${{ matrix.target }}
    # arm64 runner. A mac-x64 bundle is CROSS-compiled here, exactly as
    # linux-arm64 is cross-compiled on an x64 host — the toolchain is universal
    # and only target_cpu differs.
    runs-on: macos-14
    if: ${{ contains(inputs.targets, 'mac-') || contains(inputs.targets, 'ios-') }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            gn_args: 'target_os="mac" target_cpu="arm64" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false'
          - target: mac-x64
            gn_args: 'target_os="mac" target_cpu="x64" is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false'
          # A device build is signed by whoever ships the app, never here — this
          # produces a static library, and a signing identity in a build
          # repository would be both useless and a liability.
          # target_environment="device" is REQUIRED, not a default. gn asserts
          # it is one of simulator/device/catalyst, and an unset value fails the
          # assertion with an empty string in the message — which reads like a
          # missing SDK rather than a missing argument. Only the simulator line
          # carried it, so the device build died at gn gen after a 20-minute
          # sync.
          - target: ios-arm64
            gn_args: 'target_os="ios" target_cpu="arm64" target_environment="device" ios_enable_code_signing=false is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false'
          # The simulator is a DIFFERENT target, not a debug flavour of the
          # device one: same CPU, different SDK and a different `-isysroot`, so a
          # device bundle will not link a simulator app. Both are published
          # because a developer needs the simulator and a user needs the device.
          - target: ios-sim-arm64
            gn_args: 'target_os="ios" target_cpu="arm64" target_environment="simulator" ios_enable_code_signing=false is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false'
          # For an Intel Mac running the simulator. Cheap to add beside the
          # others; dropped from the default target list, not from the matrix.
          - target: ios-sim-x64
            gn_args: 'target_os="ios" target_cpu="x64" target_environment="simulator" ios_enable_code_signing=false is_debug=false is_component_build=false symbol_level=0 rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false rtc_enable_protobuf=false rtc_use_h264=false enable_libaom=false rtc_include_opus=true treat_warnings_as_errors=false'
    env:
      WEBRTC_ROOT: ${{ github.workspace }}/../webrtc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the pins
        run: grep -E '^[A-Z_]+=' PIN >> "$GITHUB_ENV"

      - name: Skip targets not asked for
        id: want
        run: |
          if echo "${{ inputs.targets }}" | grep -qw "${{ matrix.target }}"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.target }} was not requested"
          fi

      # Say which Xcode built this. The bundle rewrites -isysroot on the
      # consumer's machine, so the two versions need not match — but when a
      # header does go missing, the first question is which SDK it was compiled
      # against, and a log that cannot answer costs a rebuild.
      - name: Xcode
        if: steps.want.outputs.run == 'yes'
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Reclaim disk
        if: steps.want.outputs.run == 'yes'
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /Applications/Xcode_14*.app /Applications/Xcode_15.0*.app \
                      ~/Library/Developer/CoreSimulator/Caches || true
          echo "after:"; df -h / | tail -1

      - name: depot_tools
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          git clone --filter=blob:none \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          git -C "$HOME/depot_tools" checkout --detach "$DEPOT_TOOLS_PIN"
          "$HOME/depot_tools/ensure_bootstrap"
          echo "DEPOT_TOOLS_UPDATE=0" >> "$GITHUB_ENV"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # target_os = ['ios'] before the sync, for the same reason android needs
      # it: the iOS-only parts of the dependency tree are not fetched otherwise
      # and gn fails later on a missing toolchain rather than on the real cause.
      - name: WebRTC at the pinned commit
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          mkdir -p "$WEBRTC_ROOT"
          cd "$WEBRTC_ROOT"
          fetch --nohooks webrtc
          case "${{ matrix.target }}" in
            ios-*) grep -q "target_os" .gclient || echo "target_os = ['ios']" >> .gclient ;;
          esac
          cat .gclient
          cd src
          git checkout "$WEBRTC_PIN"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "sync attempt $attempt"
            if gclient sync --with_branch_heads --reset --jobs 4; then ok=1; break; fi
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "::error::gclient sync failed after 6 attempts"; exit 1; }

      - name: Build libwebrtc.a
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          cd "$WEBRTC_ROOT/src"
          gn gen "out/${{ matrix.target }}" --export-compile-commands --args='${{ matrix.gn_args }}'
          test -f "out/${{ matrix.target }}/compile_commands.json" \
            || { echo "::error::gn produced no compile_commands.json — the bundle is built out of it"; exit 1; }
          # By name, for the reason the other hosts ask by name: `webrtc` is a
          # static library and pulls no C++ runtime, so on a host where libc++
          # is not built as a side effect the bundle ships an empty objects
          # directory and the failure only lands at the consumer's link.
          ninja -C "out/${{ matrix.target }}" webrtc \
            buildtools/third_party/libc++ buildtools/third_party/libc++abi
          ls -la "out/${{ matrix.target }}/obj/libwebrtc.a"
          for comp in libc++ libc++abi; do
            n=$(find "out/${{ matrix.target }}/obj/buildtools/third_party/$comp" \
                  -name '*.o' 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] || { echo "::error::no $comp objects — the wrapper cannot link"; exit 1; }
            echo "  $comp: $n objects"
          done

      - name: Package the SDK bundle
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          python3 scripts/pack_sdk.py \
            --src "$WEBRTC_ROOT/src" \
            --out "out/${{ matrix.target }}" \
            --target "${{ matrix.target }}" \
            --dest "$RUNNER_TEMP/veil-webrtc-sdk-${{ matrix.target }}" \
            --webrtc-pin "$WEBRTC_PIN" \
            --depot-tools-pin "$DEPOT_TOOLS_PIN" \
            --schema "$SDK_SCHEMA" \
            --built-by "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: The bundle alone builds the wrapper
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/veilnetwork/veil.git "$RUNNER_TEMP/veil"
          echo "veil at $(git -C "$RUNNER_TEMP/veil" rev-parse HEAD)"
          bash scripts/verify-sdk.sh \
            --bundle "$RUNNER_TEMP/veil-webrtc-sdk-${{ matrix.target }}" \
            --target "${{ matrix.target }}" \
            --veil "$RUNNER_TEMP/veil" \
            --hide "$WEBRTC_ROOT" \
            --dest "$RUNNER_TEMP/engine-out"

      - name: Compress
        if: steps.want.outputs.run == 'yes'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP"
          tar -C "$RUNNER_TEMP" -cf - "veil-webrtc-sdk-${{ matrix.target }}" \
            | xz -T0 -6 > "assets/veil-webrtc-sdk-${{ matrix.target }}.tar.xz"
          cp "veil-webrtc-sdk-${{ matrix.target }}/src/out/${{ matrix.target }}/obj/libwebrtc.a" \
             "assets/libwebrtc-${{ matrix.target }}.a"
          cp "veil-webrtc-sdk-${{ matrix.target }}/veil-webrtc-sdk.json" \
             "assets/veil-webrtc-sdk-${{ matrix.target }}.json"
          ls -la assets/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.want.outputs.run == 'yes'
        with:
          name: sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error

  # -------------------------------------------------------------- windows ---
  # A Windows HOST is required for the win-x64 toolchain and the Media
  # Foundation headers. DEPOT_TOOLS_WIN_TOOLCHAIN=0 is not optional: without it
  # depot_tools tries to fetch Google's internal Visual Studio package and fails
  # with an access error that reads like a network problem.
  windows:
    name: win-x64
    runs-on: windows-latest
    if: ${{ contains(inputs.targets, 'win-x64') }}
    timeout-minutes: 350
    env:
      WEBRTC_ROOT: 'C:\webrtc'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      # Staged on C:, not in RUNNER_TEMP. RUNNER_TEMP is on the runner's small
      # work volume; the checkout, the build tree, the staged bundle and the
      # zip all have to fit somewhere, and C: is the only drive with room for
      # them once "Reclaim disk" has run.
      SDK_STAGE: 'C:\sdk-stage'
      SDK_ASSETS: 'C:\sdk-assets'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the pins
        shell: bash
        run: grep -E '^[A-Z_]+=' PIN >> "$GITHUB_ENV"

      - name: Reclaim disk
        shell: pwsh
        run: |
          # Every drive, not just C:. Where the bundle is staged depends on
          # which one has the room, and "no space" arrives from deep inside
          # gclient as a write error that names nothing.
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table
          foreach ($path in @(
            "$env:ProgramFiles\dotnet\sdk",
            "${env:ProgramFiles(x86)}\Android",
            "$env:AGENT_TOOLSDIRECTORY\Ruby",
            "$env:AGENT_TOOLSDIRECTORY\go",
            "$env:AGENT_TOOLSDIRECTORY\CodeQL",
            "$env:AGENT_TOOLSDIRECTORY\PyPy",
            "C:\Modules",
            "$env:ProgramFiles\MongoDB",
            "$env:ProgramFiles\PostgreSQL",
            "${env:ProgramFiles(x86)}\Microsoft SQL Server",
            "$env:ProgramFiles\Microsoft SQL Server",
            "C:\SeleniumWebDrivers"
          )) {
            if (Test-Path $path) { Remove-Item -Recurse -Force $path -ErrorAction SilentlyContinue }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

      # PINNED, for the reason the linux job gives — and the pin is exactly why
      # this step has to run the bootstrap by hand.
      #
      # depot_tools on Windows does not call `git`. It calls `git.bat`
      # (git_cache.py: `git_exe = "git.bat" if sys.platform.startswith("win")`),
      # a stub that is NOT in the repository — .gitignore lists it — because
      # bootstrap/bootstrap.py generates it, pointed at whatever Git the machine
      # has. CreateProcess resolves a name that already carries an extension by
      # exact match along PATH, so Git for Windows' git.exe cannot stand in for
      # it, and GetCachePath catches CalledProcessError, not FileNotFoundError.
      #
      # Normally `fetch` triggers that generation: fetch.bat calls
      # update_depot_tools.bat, which ends in bootstrap\win_tools.bat. But
      # update_depot_tools.bat returns at `IF "%DEPOT_TOOLS_UPDATE%" == "0"`,
      # several lines BEFORE that call — and this job sets DEPOT_TOOLS_UPDATE=0,
      # because the lines after it are `git fetch origin` and `git checkout
      # origin/main` and the pin would be gone. Pinning depot_tools therefore
      # switches its Windows bootstrap off. Run 31680937721 is what that looks
      # like: FileNotFoundError [WinError 2] out of gclient sync, six minutes in.
      # xVeil's webrtc-windows.yml built this same target fine on 2026-07-31 for
      # the one reason that it had not pinned depot_tools yet.
