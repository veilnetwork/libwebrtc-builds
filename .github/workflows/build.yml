        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          if ($LASTEXITCODE -ne 0) { throw 'depot_tools clone failed' }
          git -C C:\depot_tools checkout --detach $env:DEPOT_TOOLS_PIN
          if ($LASTEXITCODE -ne 0) { throw "depot_tools has no commit $env:DEPOT_TOOLS_PIN" }

          # The state that killed run 31680937721, recorded rather than assumed.
          Write-Host "system git.exe:           $((Get-Command git.exe -ErrorAction SilentlyContinue).Source)"
          Write-Host "git.bat before bootstrap: $(Test-Path C:\depot_tools\git.bat)"

