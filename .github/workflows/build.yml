          # touch the global config. autocrlf is not cosmetic on a Chromium
          # checkout: Git for Windows defaults it on, and a checkout rewritten
          # to CRLF fails later in places that do not mention line endings.
          git config --global depot-tools.allowGlobalGitConfig true
          git config --global core.autocrlf false
          git config --global core.longpaths true

          & C:\depot_tools\bootstrap\win_tools.bat
          if ($LASTEXITCODE -ne 0) { throw "depot_tools bootstrap failed ($LASTEXITCODE)" }

          # The artifact, not the exit code. This is the file whose absence was
          # the whole failure, so its presence is what gets asserted.
          if (-not (Test-Path C:\depot_tools\git.bat)) {
            throw 'bootstrap reported success and produced no C:\depot_tools\git.bat'
          }
          & C:\depot_tools\git.bat --version
          if ($LASTEXITCODE -ne 0) { throw 'the generated git.bat does not run' }

          "DEPOT_TOOLS_UPDATE=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: WebRTC at the pinned commit
        shell: cmd
        run: |
          rem Resolve the exact name depot_tools will spawn, before paying 25
          rem minutes to be told the same thing by a traceback. `where` searches
          rem PATH the way CreateProcess does and exits 1 when it finds nothing.
          where git.bat || exit /b 1
          mkdir %WEBRTC_ROOT%
          cd /d %WEBRTC_ROOT%
          call fetch --nohooks webrtc || exit /b 1
          cd src
          call git checkout %WEBRTC_PIN% || exit /b 1
