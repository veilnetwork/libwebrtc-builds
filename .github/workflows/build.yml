            Write-Host "==> compressing with $sevenZip"
            & $sevenZip a -tzip -mx=6 -mmt=on -bso0 -bsp0 $zip $bundle
            if ($LASTEXITCODE -ne 0) { throw "7z exited $LASTEXITCODE" }
          } else {
            Write-Host '==> compressing with Compress-Archive'
            Compress-Archive -Path $bundle -DestinationPath $zip
          }
          if (-not (Test-Path $zip)) { throw "no $zip after compressing" }

          Copy-Item "$bundle\src\out\win-x64\obj\webrtc.lib" "$env:SDK_ASSETS\webrtc-win-x64.lib"
          Copy-Item "$bundle\veil-webrtc-sdk.json" "$env:SDK_ASSETS\veil-webrtc-sdk-win-x64.json"
          Get-ChildItem $env:SDK_ASSETS | Select-Object Name, Length | Format-Table
          # A release asset is capped at 2 GB and this is the only target whose
          # archive could approach it. Fail here, where it is one line, rather
          # than in the publish job after another hour.
          $size = (Get-Item $zip).Length
          if ($size -ge 2GB) { throw "$zip is $size bytes - over GitHub's 2 GB asset cap" }

      # Uploaded BEFORE the verify below, which is the one departure from the
      # linux job's order. The verify runs a wrapper build that this repository
      # does not own; if it fails, the hour of WebRTC that produced these assets
      # should still be in hand to look at rather than thrown away with the
      # runner.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Forward slashes: this is a glob pattern, not a path, and a
          # backslash in one is an escape character.
          name: sdk-win-x64
          path: C:/sdk-assets/*
          if-no-files-found: error

      # The claim being tested is "this bundle alone builds the wrapper", so the
      # checkout it was cut from is renamed away first — see verify-sdk.ps1 and
      # the identical note on the linux job.
      - name: The bundle alone builds the wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/veilnetwork/veil.git "$env:RUNNER_TEMP\veil"
          if ($LASTEXITCODE -ne 0) { throw 'could not clone veil' }
          Write-Host "veil at $(git -C "$env:RUNNER_TEMP\veil" rev-parse HEAD)"
          & .\scripts\verify-sdk.ps1 `
            -Bundle "$env:SDK_STAGE\veil-webrtc-sdk-win-x64" `
            -Target win-x64 `
            -Veil "$env:RUNNER_TEMP\veil" `
            -Hide "$env:WEBRTC_ROOT" `
            -Dest "$env:RUNNER_TEMP\engine-out"

  # -------------------------------------------------------------- publish ---
  # The only job that can write. It compiles nothing and downloads nothing from
  # the network beyond the run's own artifacts, so the token with write access
  # is never in the same job as a build that executes third-party code.

  # -------------------------------------------------------- windows arm64 ---
  # A SEPARATE job rather than a matrix over the one above, deliberately. That
  # job is the only thing producing the Windows SDK today; folding a second
  # architecture into its cmd blocks and hardcoded out/ paths would put the
  # working build at risk for a target whose toolchain cannot be confirmed
  # without running it. Consolidate once this one has succeeded at least once.
  #
  # Cross-compiled from the x64 host: the ARM64 cross tools ship as a Visual
  # Studio COMPONENT, and the step below installs it rather than assuming the
  # runner image carries it. If a future image does, the install is a no-op.
  windows-arm64:
    name: win-arm64
    runs-on: windows-latest
    if: ${{ contains(inputs.targets, 'win-arm64') }}
    timeout-minutes: 350
    env:
      WEBRTC_ROOT: 'C:\webrtc-arm64'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      # Staged on C:, not in RUNNER_TEMP. RUNNER_TEMP is on the runner's small
      # work volume; the checkout, the build tree, the staged bundle and the
      # zip all have to fit somewhere, and C: is the only drive with room for
      # them once "Reclaim disk" has run.
      SDK_STAGE: 'C:\sdk-stage'
      SDK_ASSETS: 'C:\sdk-assets'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

